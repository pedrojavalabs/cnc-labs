spring.datasource.url=jdbc:h2:mem:cnclabs
spring.datasource.driverClassName=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
vaadin.launch-browser=false
server.port=8080
cnc.upload-dir=./uploads
cnc.output-dir=./cimatron-output

# Fix for Docker / jar deployment
vaadin.productionMode=true
vaadin.whitelisted-packages=com.vaadin,org.vaadin,com.cnclabs
vaadin.frontend.hotdeploy=false
