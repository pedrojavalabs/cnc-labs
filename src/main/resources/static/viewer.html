<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><title>CNC LABS Viewer</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<style>body{margin:0;background:#0a0a0a;color:#e0e0e0;font-family:monospace} #c{width:100vw;height:100vh} .bar{position:absolute;bottom:12px;left:12px;display:flex;gap:8px} button{background:#222;color:#d4ff00;border:1px solid #333;padding:6px 10px;border-radius:6px;cursor:pointer} #top{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.7);padding:4px 8px;border-radius:4px;color:#d4ff00;font-size:11px}</style>
</head>
<body>
<div id="top">CNC LABS // STL + DXF VIEWER</div>
<div id="c"></div>
<div class="bar"><button id="wire">WIREFRAME</button><button id="fit">FIT</button><button id="topv">TOP</button><button id="toggle">2D/3D</button></div>
<canvas id="dxf" style="display:none;width:100vw;height:100vh;background:#fafafa"></canvas>
<script type="module">
import * as THREE from 'three'; import { STLLoader } from 'three/addons/loaders/STLLoader.js'; import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
const container=document.getElementById('c'); const scene=new THREE.Scene(); scene.background=new THREE.Color(0x0a0a0a);
const camera=new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 2000); camera.position.set(60,40,80);
const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setSize(window.innerWidth, window.innerHeight); container.appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0xffffff,0.6)); const d1=new THREE.DirectionalLight(0xffffff,1); d1.position.set(50,100,50); scene.add(d1); scene.add(new THREE.GridHelper(200,40,0x333333,0x222222));
const controls=new OrbitControls(camera, renderer.domElement); controls.enableDamping=true;
let mesh=null; function animate(){ requestAnimationFrame(animate); controls.update(); renderer.render(scene,camera);} animate();
window.addEventListener('resize', ()=>{ camera.aspect=window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight);});
function loadSTL(url){ new STLLoader().load(url, g=>{ g.computeVertexNormals(); g.center(); if(mesh) scene.remove(mesh); mesh=new THREE.Mesh(g, new THREE.MeshStandardMaterial({color:0xe0e0e0})); scene.add(mesh); const box=new THREE.Box3().setFromObject(mesh); const c=box.getCenter(new THREE.Vector3()); controls.target.copy(c); camera.position.copy(c).add(new THREE.Vector3(50,40,50));});}
document.getElementById('wire').onclick=()=>{ if(mesh) mesh.material.wireframe=!mesh.material.wireframe; };
document.getElementById('fit').onclick=()=>{ if(mesh){ const b=new THREE.Box3().setFromObject(mesh); controls.target.copy(b.getCenter(new THREE.Vector3()));}};
document.getElementById('topv').onclick=()=>{ camera.position.set(0,150,0); controls.target.set(0,0,0);};
let is3D=true; document.getElementById('toggle').onclick=()=>{ is3D=!is3D; document.getElementById('c').style.display=is3D?'block':'none'; document.getElementById('dxf').style.display=is3D?'none':'block'; };
const p=new URLSearchParams(location.search); const f=p.get('file'); if(f) loadSTL(f);
window.loadSTL=loadSTL;
</script>
</body>
</html>
